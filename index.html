<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VitaArchive</title>

    <link rel="icon" type="image/png" href="images/logo.png">

    <link rel="stylesheet" href="css/styles.css">

</head>


<body>


<header>

    <nav>

        <a href="index.html" class="logo">

            <img 
                src="images/logo.png" 
                class="logo-img" 
                alt="VitaArchive">

        </a>

    </nav>

</header>


<main>


    <section class="store-header">


        <h1>
            VitaArchive
        </h1>


        <p>
            Homebrew para PlayStation Vita.
        </p>


        <p id="app-count">

            Cargando aplicaciones...

        </p>


    </section>



    <section class="filters">


        <input 

            type="text"

            id="search"

            placeholder="Buscar aplicación..."

        >


        <select id="type-filter">


            <option value="all">

                Todas

            </option>


            <option value="utility">

                Utilidades

            </option>


            <option value="port">

                Ports

            </option>


            <option value="game">

                Juegos

            </option>


        </select>


    </section>



    <section 
        id="apps" 
        class="grid-container">


    </section>


</main>



<footer>


    <p>

        VitaArchive by rompelhd © 2026

    </p>



    <p>

        Powered by

        <a 
            href="https://github.com/robin994/NeoVitaDB-Catalog"
            target="_blank">

            NeoVitaDB

        </a>

        ·

        <a 
            href="https://github.com/rompelhd/VitaArchive"
            target="_blank">

            GitHub

        </a>


    </p>


</footer>



<script src="js/store.js"></script>


</body>

</html>
