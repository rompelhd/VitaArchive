<!DOCTYPE html>

    <title>Perfil - VitaArchive</title>

    <link rel="stylesheet" href="css/styles.css">

</head>


<body>


<header>

    <nav>

        <a href="index.html" class="logo">

            <img
                src="images/logo.png"
                class="logo-img"
                alt="VitaArchive">

        </a>

    </nav>

</header>




<main>


    <section class="profile">


        <img
            id="user-image"
            class="user-image"
            src="images/users/default.png"
            alt="Avatar del usuario">


        <h1 id="username">
            Usuario
        </h1>


        <p id="user-description"></p>


    </section>




    <h2>
        Aplicaciones publicadas
    </h2>


    <section
        id="user-apps"
        class="grid-container">

    </section>


</main>




<footer>

        VitaArchive by rompelhd © 2026
